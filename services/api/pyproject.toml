[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sih-api"
version = "0.1.0"
description = "Checkpoint 1 API for SIH 26128 livestock surveillance"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi==0.141.1",
  "geoalchemy2>=0.18,<1",
  "pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "python-json-logger>=3.3,<4",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "pyyaml>=6,<7",
  "ruff>=0.12,<1"
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: requires a PostgreSQL/PostGIS database"
]
addopts = "--strict-markers --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*"]
ignore_missing_imports = true
